<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuración de documentos</title><link rel="stylesheet" href="/css/ayuntamientos.css"><link rel="stylesheet" href="/css/configuracion-documentos.css"></head><body><main><header class="page-header page-header-with-link"><div><h1>Configuración de documentos</h1></div><a class="button button-secondary" href="/documentos-facturacion.html">Volver a documentos</a></header><section class="panel panel-configuracion-documentos"><p>Logo y datos del emisor se aplican a todas las reimpresiones. El presidente se captura al emitir por primera vez.</p><p id="estado-configuracion" role="status"></p><p id="error-configuracion" role="alert"></p><button id="reintentar-configuracion" class="button button-secondary" hidden>Reintentar consulta</button><form id="formulario-configuracion"><div class="form-grid">
<div class="form-field"><label for="denominacion">Denominación del emisor</label><input id="denominacion" maxlength="500" required></div><div class="form-field"><label for="cif">CIF del emisor</label><input id="cif" maxlength="500" required></div><div class="form-field form-field-wide"><label for="direccion">Dirección del emisor</label><input id="direccion" maxlength="500" required></div><div class="form-field"><label for="contacto">Contacto (opcional)</label><input id="contacto" maxlength="500"></div><div class="form-field"><label for="nombre_presidente">Presidente</label><input id="nombre_presidente" maxlength="500"></div><div class="form-field form-field-wide opciones-logo"><label for="logo">Logo PNG/JPEG (máximo 1 MiB, 4096 × 4096)</label><input id="logo" type="file" accept="image/png,image/jpeg"><label class="quitar-logo" for="quitar-logo"><input id="quitar-logo" type="checkbox"><span>Quitar logo personalizado</span></label><img id="vista-logo" alt="Logo actual" hidden></div></div><div class="form-actions"><button id="guardar-configuracion" class="button button-primary">Guardar configuración</button></div></form></section></main><script type="module" src="/js/configuracion-documentos.js"></script></body></html>
